
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soundmap</title>
    <style>
        * {
            font-family: monospace;
            margin:0;
            box-sizing: border-box;
        }

        h1,h2 {font-weight:normal;margin:0 0 16px 0;}

        .rack {
            border:black solid 1px;
            padding:8px 10px;
            background:#E6E6E6;
            width:calc(100% - 16px);
            margin:8px;
        }

        .soundmap {
            width: 600px;
            height:266px;
            background:#F0F0F0;
            padding:8px;
            border:black solid 1px;
            margin-bottom:16px;
        }
        .soundmap .controls {
            float:left;
            margin-left:16px;
            padding-left:16px;
            border-left:#00000090 dashed 1px;
            height:100%;
        }
        .soundmap .controls .levelSlider, .soundmap .controls button {
            display:block;
            margin-bottom:8px;
        }
        .soundmap .controls h2 {
            width:fit-content;
        }
        .soundmap .player {
            float:left;
            box-shadow:black 0 0 0 1px,white 0 0 0 2px,black 0 0 6px;
            width:250px;
            height:250px;
            image-rendering: pixelated;
            background:#FFFFFF90;
        }

        #buttons {
            border:black solid 1px;
            background:#E6E6E6;
            width:calc(100% - 16px);
            margin:8px;
            padding:4px;
            height:34px;
        }

        #buttons * {
            height: 24px;
            vertical-align: top;
            font-size:16px;
        }
        input[type=range] {
            margin:0;
        }
        #buttons span {vertical-align: middle;}
    </style>
</head>

        <button id="playbtn">Play</button>
        <input type="range" name="" id="globalvolume">

        <div style="float:right;">

        </div>
    </div>

        let playing = 0;
        document.getElementById("playbtn").addEventListener("click",(e)=>{
            if(playing==0){

                playing=0;
                e.srcElement.innerText = "Play";

        });

        let defaultrack = document.getElementsByClassName("rack")[0];

        class soundmap {
            constructor(width=32,height=32,level=1,name="soundmap",data=undefined,racknode=defaultrack){
                // attributes
                this.width = width;
                this.height = height;
                this.level = level;
                this.racknode = racknode;
                this.name = name;
                this.data = data; // most important part probably

                // build elements
                let soundmapNode = document.createElement("div");
                soundmapNode.className = "soundmap";
                let playerNode = document.createElement("canvas");
                playerNode.className = "player";
                playerNode.width = width;
                playerNode.height = height;

                let controlsNode = document.createElement("div");
                controlsNode.className = "controls";

                this.titleNode = document.createElement("h2");
                this.titleNode.innerText = name;
                controlsNode.appendChild(this.titleNode);

                let levelNode = document.createElement("input");
                levelNode.type = "range";
                levelNode.className = "levelSlider";
                controlsNode.appendChild(levelNode);

                let envNode = document.createElement("button");
                envNode.innerText = "Create Envelope";
                controlsNode.appendChild(envNode);

                let renNode = document.createElement("button");
                renNode.innerText = "Rename";
                renNode.onclick = this.rename;
                controlsNode.appendChild(renNode);

                let delNode = document.createElement("button");
                delNode.innerText = "Delete";
                controlsNode.appendChild(delNode);

                racknode.appendChild(soundmapNode);
                soundmapNode.appendChild(playerNode);
                soundmapNode.appendChild(controlsNode);
                // god i hate this


                


            };

            rename(){
                this.parentElement.children[0].innerText = prompt("New name:");
            }
        };
